name: upstream-watch

on:
  schedule:
    # 06:00 UTC daily, offset from the hour so it does not line up with every
    # other project's cron and compete for shared runner capacity.
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Resolve pending versions and report them without installing anything or opening a pull request
        type: boolean
        default: false

permissions:
  contents: read

# Every run rebuilds and force-pushes the same branch, so two at once, a
# scheduled run and a manual one, would each build on a working tree that
# lacks the other's results and the later push would discard the earlier.
# Queued rather than cancelled, so a run already testing is never cut short.
concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      # Needed only to open the pull request below; this job never pushes to
      # main directly, and the checkout step itself only reads.
      contents: write
      pull-requests: write
    steps:
      # GitHub fixes a scheduled run's commit when it queues the event, and
      # the job can start a quarter of an hour or more after that. With no
      # ref, checkout uses that fixed commit, so a results pull request merged
      # in the meantime is missing here: its versions look pending again and
      # are rerun, and the branch below is rebuilt on a main that has already
      # moved past it, conflicting with main as soon as it is pushed. Naming
      # the ref makes checkout fetch the branch's tip when the job starts.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # gouroboros is a Go tool. Its adapter assumes a "go" binary is already
      # on PATH the same way the npm adapters assume npm is, and records the
      # version untested with the verbatim error rather than failing the job
      # when it is not; this step is what keeps that from happening here.
      # "stable" rather than a pinned number, because the adapter builds
      # against whatever release of gouroboros is pending and lets Go's own
      # toolchain-switching resolve whatever that release's go.mod requires.
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # cardano-client-lib is a Java tool. Its adapter assumes "java" and
      # "mvn" are already on PATH the same way "go" is for gouroboros, and
      # records the version untested with the verbatim error rather than
      # failing the job when they are not; this step is what keeps that from
      # happening here. Maven ships preinstalled on the runner image, so only
      # the JDK needs pinning, to the same release this adapter's pom.xml
      # compiles against.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # pallas is a Rust crate. Its adapter assumes a "cargo" binary is
      # already on PATH the same way gouroboros's assumes "go" is, and pins
      # the exact pallas-primitives/pallas-codec/pallas-crypto release in the
      # scratch Cargo.toml it writes rather than this step choosing a
      # version; "stable" just needs to be new enough to build whatever that
      # release's own edition/rust-version requires (1.88 as of pallas 1.3.0).
      - uses: dtolnay/rust-toolchain@stable

      # pycardano is a Python package. Its adapter assumes a "python3" binary
      # is already on PATH the same way the others assume their own
      # toolchains are, and creates its own venv per run rather than
      # installing anything globally. 3.12 matches what this project develops
      # and tests the adapter against.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Resolve pending versions and run the watcher
        id: watch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npx tsx scripts/compat-watch.ts --dry-run
          else
            # Fold in whatever compat/results already sit on an open
            # upstream-watch/results pull request before deciding what is
            # pending, so a result recorded there is neither rerun nor, once
            # the branch below is rebuilt from this checkout, dropped.
            # The list it writes lets compat-watch describe the carried
            # results in the title and body as well as the ones it tests,
            # since both replace whatever the open pull request said before.
            npx tsx scripts/carry-forward-results.ts --out compat-carried.json
            npx tsx scripts/compat-watch.ts --carried compat-carried.json
          fi
          echo "title=$(cat compat-watch-title.txt)" >> "$GITHUB_OUTPUT"

      - name: Report
        run: cat compat-watch-body.md

      # compat/aggregate.json is generated from compat/results/, and
      # compat/version.json is generated from compat/aggregate.json in turn:
      # ci.yml's "Compat aggregate is current" and "Compat version is
      # current" steps fail a pull request that adds result files without
      # regenerating both, the same way either would fail one that hand-
      # edited a result. Regenerating here, before the diff check below, is
      # what keeps this workflow's own pull requests passing those checks.
      - name: Regenerate compat aggregate and version
        if: ${{ inputs.dry_run != true }}
        run: |
          npm run compat:aggregate
          npm run compat:version

      # peter-evans/create-pull-request rebuilds upstream-watch/results from
      # this checkout and force-pushes it every run. Its own README warns that
      # when that leaves the branch with no diff against base, it deletes the
      # branch, closing whatever pull request was open on it. The watcher's
      # own "nothing pending" count is not a safe stand-in for that check: on
      # a quiet day, or a day where every pending version was already carried
      # forward above, `ran` is empty even though a pull request opened on an
      # earlier day may still be sitting there with results on it. Checking
      # the working tree directly is what keeps that PR open on days like
      # that instead of closing it and discarding its results.
      - name: Check whether compat/results changed
        id: diff
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- compat/results)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Checking out the tip above shortens the window in which main can move
      # under this run, but a results pull request merged while the job is
      # testing still leaves this working tree behind main, with the same
      # conflict as before. Comparing against the tip immediately before the
      # branch is rebuilt catches that case. The results this run produced are
      # discarded with it; the versions they cover are still pending against
      # the new main, so a rerun tests them again.
      - name: Check the branch has not moved during this run
        if: ${{ inputs.dry_run != true && steps.diff.outputs.changed == 'true' }}
        run: |
          set -euo pipefail
          checked_out=$(git rev-parse HEAD)
          git fetch --quiet origin "${GITHUB_REF}"
          tip=$(git rev-parse FETCH_HEAD)
          if [ "$checked_out" != "$tip" ]; then
            echo "::error::${GITHUB_REF} moved from ${checked_out} to ${tip} while this run was testing, so no pull request was opened on the old base. Rerun the workflow to test the same versions against the new tip."
            exit 1
          fi

      - name: Open pull request
        if: ${{ inputs.dry_run != true && steps.diff.outputs.changed == 'true' }}
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: ${{ steps.watch.outputs.title }}
          title: ${{ steps.watch.outputs.title }}
          body-path: compat-watch-body.md
          branch: upstream-watch/results
          add-paths: |
            compat/results/**
            compat/aggregate.json
            compat/version.json
          delete-branch: true
