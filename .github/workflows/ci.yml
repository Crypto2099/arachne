name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint and format
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The offline suites. The chain project is excluded on purpose: it submits
      # real transactions to a public testnet and spends testnet ADA, so it is
      # run deliberately rather than on every push.
      - name: Test
        run: npm test

      # Regenerates the corpus and fails if the committed files disagree. This
      # is what stops a vector being edited by hand.
      - name: Verify corpus
        run: npm run vectors:verify

      - name: Corpus is current
        run: |
          npm run vectors:build
          if ! git diff --quiet -- vectors/ ':!vectors/index.json'; then
            echo "The committed corpus does not match the generator."
            echo "Run 'npm run vectors:build' and commit the result."
            git diff --stat -- vectors/
            exit 1
          fi

      # Same discipline as the corpus: compat/aggregate.json is generated from
      # compat/tools.json and compat/results/, so a hand edit, or a result
      # file committed without regenerating it, fails the build here.
      - name: Compat aggregate is current
        run: npm run compat:aggregate:check

      # compat/version.json is generated from compat/aggregate.json's own
      # committed bytes, so it moves whenever the aggregate does and must be
      # checked after it, the same order "npm run verify" runs both in.
      - name: Compat version is current
        run: npm run compat:version:check

      # chain-evidence/record.md is the human-readable rendering of
      # chain-evidence/observations.json, generated by the same discipline as
      # the compat aggregate above: a hand edit, or a copy left stale after
      # observations.json changed, fails here.
      - name: Chain evidence record is current
        run: npm run chain-evidence:record:check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=critical

  # cardano-cli is the Haskell tool that shares cardano-api's serialization path
  # with the node, which makes it the authoritative oracle for what the chain
  # computes. It is pinned rather than floating: a change in what it produces is
  # a finding, and this job should be the thing that reports it.
  cardano-cli:
    runs-on: ubuntu-latest
    env:
      CARDANO_CLI_VERSION: 11.2.3.1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install cardano-cli
        run: |
          set -euo pipefail
          base="https://github.com/IntersectMBO/cardano-cli/releases/download/cardano-cli-${CARDANO_CLI_VERSION}"
          curl -fsSL -o cli.tar.gz "${base}/cardano-cli-${CARDANO_CLI_VERSION}-x86_64-linux.tar.gz"
          curl -fsSL -o sums.txt "${base}/cardano-cli-${CARDANO_CLI_VERSION}-sha256sums.txt"
          expected=$(grep "x86_64-linux.tar.gz" sums.txt | awk '{print $1}')
          echo "${expected}  cli.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf cli.tar.gz -C "$HOME/.local/bin"
          # The archive holds a platform-suffixed binary, not a bare name.
          mv "$HOME/.local/bin/cardano-cli-x86_64-linux" "$HOME/.local/bin/cardano-cli"
          chmod +x "$HOME/.local/bin/cardano-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Report the version under test
        run: cardano-cli --version

      - name: Cross-check the corpus against cardano-cli
        run: npm run test:cli
